<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealX - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar (Upar ki patti) -->
    <header class="navbar">
        <div class="left-nav">
            <!-- 3 Lines wala Menu Button -->
            <button id="menu-btn" class="icon-btn" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">☰</button>
            
            <!-- RealX Logo (Is par click karne se home page refresh hoga) -->
            <a href="index.html" class="logo" style="text-decoration: none; color: white; font-size: 24px; font-weight: bold; margin-left: 15px;">RealX</a>
        </div>
        
        <div class="search-bar">
            <!-- Search Box -->
            <input type="text" id="search-input" placeholder="Search videos...">
        </div>
    </header>

    <!-- Sidebar (Left side wala menu - isme ab sirf 2 item hain) -->
    <div id="sidebar" class="sidebar">
        <a href="index.html">🏠 Home</a>
        <a href="#">📁 Category</a>
    </div>

    <!-- Main Content (Jahan saari videos dikhengi) -->
    <main class="main-content">
        <div id="video-grid" class="video-grid">
            <!-- Videos yahan script.js ke zariye apne aap aayengi -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
