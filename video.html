<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealX - Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="navbar">
        <a href="index.html" class="logo">RealX</a>
        <div class="right-nav">
            <input type="text" id="search-input" class="hidden" placeholder="Search videos...">
            <button id="search-btn" class="icon-btn">🔍</button>
        </div>
    </header>

    <main class="player-container">
        <div class="video-wrapper">
            <iframe id="main-player" src="" allowfullscreen></iframe>
        </div>
        
        <div class="video-details">
            <h1 id="video-title">Loading...</h1>
            <div class="stats-row">
                <p id="video-stats">0 Views</p>
                <button id="share-btn" class="share-btn">↪ Share</button>
            </div>
        </div>

        <hr class="divider">

        <div class="recommendations-section">
            <h3>Latest Videos</h3>
            <div id="related-grid" class="video-grid">
                </div>
            <button id="load-more-btn" class="load-more">Load More</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RealX. All rights reserved.</p>
        <p><a href="#">DMCA</a> | <a href="#">Privacy Policy</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
