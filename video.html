<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealX - Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Navbar -->
    <header class="navbar">
        <div class="left-nav">
            <button id="menu-btn" class="icon-btn">☰</button>
            <a href="index.html" class="logo">RealX</a>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search videos...">
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <a href="index.html">🏠 Home</a>
        <a href="#">📁 Category</a>
    </div>

    <!-- Main Player -->
    <main class="player-container">
        <div class="video-section">
            <!-- Yahan Video tag ki jagah Iframe laga diya gaya hai -->
            <iframe id="main-player" src="" style="width: 100%; height: 500px; border-radius: 12px; background: #000;" frameborder="0" allow="autoplay; fullscreen"></iframe>
            <h2 id="video-title">Loading...</h2>
            <p id="video-stats">Loading details...</p>
        </div>
        <hr class="divider">
        <div class="recommendations-section">
            <h3>Up Next</h3>
            <div id="recommendations-list" class="r-list">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
